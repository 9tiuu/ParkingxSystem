{% extends 'tickets/base.html' %}

{% block content %}
<div class="p-3 ">
  <h2 class="my-2 blue-sys">Editar Protocolo de Seguridad</h2>
  <form method="POST">
    {% csrf_token %}
    
    <div class="d-flex flex-wrap gap-3 mt-3">
      {{ form.as_p }}
    </div>

    <button type="submit" class="btn btn-primary mt-3">Editar Protocolo</button>
  </form>
</div>
{% endblock %}
