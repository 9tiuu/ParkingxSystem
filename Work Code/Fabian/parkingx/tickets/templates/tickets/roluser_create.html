{% extends 'tickets/base.html' %}

{% block content %}
  <div class="p-4">
    <h2 class="my-2 blue-sys">Crear Nuevo Rol</h2>

    <form method="POST" class="d-flex gap-3 row mt-4">
      {% csrf_token %}
      {{ form.as_p }}  
      <div class="btn-form">
        <button type="submit" class="btn btn-primary">Crear Rol</button>
        <a href="{% url 'listrol' %}" class="btn btn-dark mx-2">Volver atrás</a>
      </div>
    </form>

  </div>
{% endblock %}
