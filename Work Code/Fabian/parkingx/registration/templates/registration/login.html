<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Parkingx</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'tickets/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'tickets/css/login.css' %}">
</head>
<body>
    
    <div class="login-container">
        <form action="#" method="post" class="login-form">
            <div class="login-icon">
                {% load static %}
                <img src="{% static 'tickets/img/Logo.png' %}" class="icon-project" alt="">
            </div>
            {% csrf_token %}
            <p class="mb-4">
                <label for="username" class="mb-1">Nombre de usuario</label>
                <input type="text" name="username" class="form-control" required>
            </p>
            <p class="mb-2">
                <label for="password" class="mb-1">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </p>
            {% if form.non_field_errors %}
            <p class="text-danger">Correo y/o contraseña incorrectos</p>
            {% endif %}
            <div>
                <input type="submit" class="btn btn-primary mt-4 w-100" value="Iniciar sesión">
            </div>
        </form>
        {% comment %} <a href="{% url 'home' %}" class="btn btn-dark back"><i class="bi bi-arrow-left-square"></i></a> {% endcomment %}
    </div>
   
</body>
    {% load static %}
    <script src="{% static 'tickets/js/script.js' %}"></script>
</html>
